name: Network E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 2"

permissions:
  contents: read

jobs:
  public-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
